[project]
name = "sentinel-agent"
version = "0.1.0"
requires-python = ">=3.11"
description = "Sentinel monitoring agent — collects real system metrics and pushes them outbound over WebSocket."
dependencies = [
    "psutil>=6.1",
    "websockets>=14.0",
    "pydantic>=2.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[project.scripts]
sentinel-agent = "sentinel_agent.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# ASYNC109 wants callers to wrap with asyncio.timeout instead of taking a
# timeout parameter. These are internal probe helpers where a per-probe timeout
# is the clearer contract, and the timeout is applied with wait_for internally.
"sentinel_agent/collectors/latency.py" = ["ASYNC109"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel_agent*"]
