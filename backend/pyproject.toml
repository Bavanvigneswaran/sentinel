[project]
name = "sentinel-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "aiosmtplib>=3.0",
    "pywebpush>=2.0",
    "google-auth>=2.35",
    "httpx>=0.27",
    "numpy>=2.0",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "weasyprint>=62",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# joblib 1.5.3 (the latest) sets `array.shape` directly when unpickling, which
# NumPy 2.5 deprecated. Every novelty model is a forest of hundreds of arrays,
# so one joblib.load() emits hundreds of these and the layer-4 tests alone
# produced 4,808 of the suite's 4,811 warnings — burying the three real ones.
#
# Ignored narrowly (this module, this message) rather than globally, because it
# is a genuine forward-compatibility problem we cannot fix here: when NumPy
# *removes* the behaviour, loading a model breaks. If this filter ever stops
# matching, that is the signal to check whether joblib has fixed it upstream or
# whether app/services/novelty_service.py needs a different serialisation.
filterwarnings = [
    "ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:joblib.numpy_pickle",
]

[tool.ruff.lint]
# ASYNC catches blocking calls inside async functions (a hard rule in CLAUDE.md);
# S (bandit) catches weak crypto and hardcoded secrets.
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]   # asserts and test credentials
# S608: DDL cannot take bind parameters, so migrations necessarily interpolate.
# Every value here is a module constant or a Settings field validated against
# ROLE_PASSWORD_RE before use — see 0001_bootstrap_roles.
"migrations/*" = ["E501", "S608"]
# The report's HTML/CSS template is a single string constant; wrapping its
# lines would only make the markup harder to read, not the Python around it.
"app/reports/templates.py" = ["E501"]
